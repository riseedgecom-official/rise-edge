<body>
<div id="app"><div class="loading"><img src="logo.jpg" alt=""><div class="spin"></div><div id="boot-msg">Loading…</div></div></div>
<script>
// If the app cannot start (old browser, blocked network, a mistake in config.js) say so instead of a blank page.
(function () {
  var shown = false;
  function fail(msg) {
    if (shown || window.__riseReady) return;
    shown = true;
    var a = document.getElementById("app");
    if (a) a.innerHTML = '<div class="loading"><img src="logo.jpg" alt=""><h2>The app could not start</h2><p class="mut" style="max-width:420px">' +
      String(msg || "").replace(/[<>&]/g, "") + '</p><p><a href="check.html">Open the setup check</a> &nbsp;·&nbsp; <a href="./" onclick="location.reload();return false">Try again</a></p></div>';
  }
  window.addEventListener("error", function (e) { fail(e && (e.message || (e.error && e.error.message))); });
  window.addEventListener("unhandledrejection", function (e) { fail(e && e.reason && (e.reason.message || e.reason)); });
  setTimeout(function () { fail("It is taking too long. Check the internet connection."); }, 20000);
})();
</script>
<script type="module" src="app.js"></script>
</body>
</html>
